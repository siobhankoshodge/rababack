<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐑 Ra Ba Back in Time</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #764ba2;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .chapter-title {
            color: #667eea;
            text-align: center;
            margin-bottom: 20px;
            font-style: italic;
        }

        .story-text {
            line-height: 1.8;
            color: #333;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .choice-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .choice-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .choice-btn:active {
            transform: translateY(0);
        }

        .restart-btn {
            background: #f093fb;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            margin-top: 20px;
        }

        .ending-badge {
            background: gold;
            color: #333;
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .scene-emoji {
            font-size: 4em;
            text-align: center;
            margin-bottom: 20px;
        }

        .scene-image {
            width: 100%;
            max-width: 600px;
            height: 300px;
            margin: 0 auto 30px;
            display: block;
            border-radius: 15px;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .image-placeholder {
            width: 100%;
            max-width: 600px;
            height: 300px;
            margin: 0 auto 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
            border-radius: 15px;
            border: 3px dashed #764ba2;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .image-placeholder-text {
            color: #764ba2;
            font-size: 0.9em;
            text-align: center;
            padding: 20px;
            font-weight: bold;
        }

        .image-placeholder-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 20px;
            }
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐑 Ra Ba Back in Time</h1>
        <div id="game-content"></div>
    </div>

    <script>
        const gameData = {
            start: {
                chapter: "Chapter 1: The Meadow and the Mistake",
                emoji: "🐑",
                imageFile: "01_start.png",
                imagePrompt: "A cute, intelligent-looking white sheep standing in a green meadow in 2026, wearing a glowing futuristic chrome collar with blue lights and dials, looking curiously at the device, sunny day, digital art style",
                text: "In the year 2026, you are Ra Ba - not your average sheep. While the rest of the flock is content chewing the same patch of rye, you've discovered a glowing, circular device half-buried in the mud near a crashed satellite. It's a Chronos-Collar.\n\nOne afternoon, a persistent fly lands on your nose. You try to shake it off, but your hoof hovers over the collar. The device hums with power, showing you different time period symbols.\n\nWhere will you go?",
                choices: [
                    { text: "🦖 The Cretaceous Period - Dinosaurs await!", next: "cretaceous" },
                    { text: "🏺 Ancient Egypt - The Sphinx calls!", next: "egypt" },
                    { text: "🌫️ Victorian London 1888 - Mystery in the fog!", next: "london" },
                    { text: "🚀 Year 9000 - The far future beckons!", next: "future" }
                ]
            },
            
            cretaceous: {
                chapter: "Chapter 2: The Cretaceous Crisis",
                emoji: "🦖",
                imageFile: "02_cretaceous.png",
                imagePrompt: "A white sheep with a glowing collar standing in a prehistoric swamp with giant ferns, facing an enormous Tyrannosaurus Rex that towers over it, dramatic lighting, misty atmosphere, cinematic composition",
                text: "You land with a THUD in a steamy swamp. The air is thick enough to chew. Towering ferns provide the best snack you've ever had, until a massive shadow covers the sun.\n\nA Tyrannosaurus Rex looms over you, its hot breath making your wool curl. Its enormous eye focuses on you, and you can see hunger in its gaze.\n\nWhat do you do?",
                choices: [
                    { text: "🪨 The Stone Strategy - Curl into a ball and pretend to be a boulder", next: "stone" },
                    { text: "📢 The Sonic Baaa - Use the collar's sonic blast feature", next: "sonic" }
                ]
            },

            stone: {
                chapter: "Ending: The Fossil Mystery",
                emoji: "🪨",
                imageFile: "03_stone_ending.png",
                imagePrompt: "A white sheep curled into a perfect ball like a stone in a prehistoric setting, with a confused T-Rex sneezing and walking away, dust particles in air, ancient ferns in background, humorous tone",
                text: "You curl into the tightest ball possible, tucking your legs and collar away. To the T-Rex, you look like a strange, white boulder with an odd sheen.\n\nThe dinosaur sniffs cautiously. The strong smell of lanolin fills its nostrils. It sneezes - a violent, earth-shaking ACHOO - and wanders off in disgust.\n\nYou remain perfectly still for hours. Days. Years. Millennia pass.\n\nIn 2024, paleontologists discover your fossilized form. They're completely baffled by the 'Spherical Cretaceous Anomaly' - a perfectly round, white stone with traces of organic keratin and what appears to be... advanced circuitry?\n\nThe discovery makes headlines: 'Time-Traveling Sheep or Elaborate Hoax?' You've become the most controversial fossil in history!",
                ending: true
            },

            sonic: {
                chapter: "Ending: The Woolly King",
                emoji: "👑",
                imageFile: "04_sonic_ending.png",
                imagePrompt: "A triumphant white sheep wearing a golden crown, riding majestically on top of a Tyrannosaurus Rex's head through a prehistoric jungle, other dinosaurs bowing, epic hero composition, vibrant colors",
                text: "Panic sets in and you twist the collar frantically. It emits a high-frequency blast - BWAAAAAAAH!\n\nThe T-Rex recoils, its sensitive hearing overwhelmed by the sound. It bows its massive head, whimpering in a way you didn't think a dinosaur could whimper.\n\nTo your amazement, it thinks you're a thunder-god!\n\nThe T-Rex lowers its head, and you cautiously climb aboard. From your new throne atop the apex predator, you survey the prehistoric landscape.\n\nWord spreads among the dinosaurs of the Woolly King who rides the storm. You spend your days ruling the jungle from your scaly throne, the most powerful sheep in history. The other dinosaurs bring you the finest ferns as tribute.\n\nLife is good at the top of the food chain!",
                ending: true
            },

            egypt: {
                chapter: "Chapter 3: The Sands of the Sphinx",
                emoji: "🏺",
                imageFile: "05_egypt.png",
                imagePrompt: "A white sheep in Ancient Egypt standing before the Great Sphinx which is flickering with holographic glitches, pyramids in background, desert setting, mystical atmosphere with futuristic elements, golden sunset",
                text: "You materialize in Ancient Egypt with a flash of light. Pyramid builders working nearby gasp and drop their tools. Your white fleece gleams in the desert sun.\n\n'A sign from the gods!' they cry, and you're quickly escorted to the Pharaoh's Court.\n\nYou're offered golden oats and worshipped as a divine messenger. But something catches your eye: the Sphinx is flickering like a broken television screen.\n\nYou sneak away from your guards and find a hidden door in the Sphinx's paw. Inside is a Time-Watch Station with a holographic Wolf in a business suit at the controls!\n\n'Just deleting the invention of the wheel,' the Wolf sneers. 'Humanity will have to buy MY Quantum Hover-Boots instead!'\n\nWhat's your move?",
                choices: [
                    { text: "💻 The Hack - Use your sheep-intellect to upload a Grass-Virus", next: "hack" },
                    { text: "💥 The Headbutt - Charge the power crystal and shatter the timeline", next: "headbutt" }
                ]
            },

            hack: {
                chapter: "Ending: Shepherd of Time",
                emoji: "⚡",
                imageFile: "06_hack_ending.png",
                imagePrompt: "A wise-looking white sheep sitting at futuristic holographic controls inside the Sphinx, surrounded by floating screens showing different historical moments, ethereal lighting, guardian deity aesthetic",
                text: "Your hooves may be clumsy, but your mind is sharp. You approach the holographic keyboard and begin typing with surprising precision.\n\nYou upload a 'Grass-Virus' - beautiful images of clover, alfalfa, and sweet meadow grass fill every screen. The Wolf's eyes glaze over as endless fields of green overwhelm his systems.\n\n'No... NO! NOT THE GRASS!' he howls as the system locks him out.\n\nYou take over the controls, becoming the Shepherd of Time. From the shadows of history, you watch over humanity's timeline, making small adjustments here and there.\n\nA Dark Age averted. A plague slightly less severe. A great inventor getting just the inspiration they needed.\n\nYou are the guardian no one knows about, the woolly protector of the timeline itself!",
                ending: true
            },

            headbutt: {
                chapter: "Ending: President of the Sheep Multiverse",
                emoji: "🌈",
                imageFile: "07_headbutt_ending.png",
                imagePrompt: "A white sheep standing in the Oval Pasture (oval office for sheep) in a surreal dimension where everything is sheep-themed, neon pink grass, purple sky, other sheep citizens celebrating, psychedelic colors, whimsical art style",
                text: "Enough thinking. Time for action!\n\nYou lower your head and CHARGE at the power crystal. CRACK! Your thick skull meets the glowing gem with tremendous force.\n\nThe timeline doesn't just break - it SHATTERS into infinite fragments. You're sucked through a swirling portal of impossible colors.\n\nYou land in the Sheep Multiverse, a dimension where everyone is a sheep. The grass is neon pink. The sky is purple. Buildings are made of compressed wool.\n\n'THE FOUNDER HAS ARRIVED!' the sheep citizens bleat in unison.\n\nBefore you can protest, you're elected President by unanimous vote. Your campaign platform of 'More Grass, Less Predators' resonates deeply.\n\nYou spend your days in the Oval Pasture, making executive decisions about the best grazing policies. Life is surprisingly similar to your home meadow, just infinitely weirder!",
                ending: true
            },

            london: {
                chapter: "Chapter 4: The Fog of London",
                emoji: "🌫️",
                imageFile: "08_london.png",
                imagePrompt: "A white sheep running through foggy Victorian London streets at night, gas lamps glowing, cobblestone streets, a man with a shearing blade chasing in the background, atmospheric gothic mood, 1888 setting",
                text: "The year is 1888. You land on cold cobblestones in thick London fog. Gas lamps flicker in the mist.\n\nA man with a shearing blade spots you and his eyes light up. 'Fresh wool!' He chases you through the narrow streets.\n\nYou run, hooves clattering on stone, until you find yourself at a crossroads. To your left: a Telegraph Office with its door ajar. To your right: an entrance to the London sewers.\n\nWhich way?",
                choices: [
                    { text: "📡 The Telegraph - Send a message that will change history", next: "telegraph" },
                    { text: "👻 The Ghost - Disappear into the sewers and become a legend", next: "ghost" }
                ]
            },

            telegraph: {
                chapter: "Ending: The Static-Wool Revolution",
                emoji: "⚡",
                imageFile: "09_telegraph_ending.png",
                imagePrompt: "A white sheep at a Victorian telegraph machine, a stunned operator watching, newspapers with headlines about 'Static-Wool Energy' in background, Queen Victoria knighting the sheep, steampunk industrial revolution aesthetic",
                text: "You dash into the Telegraph Office, startling the operator. Using your hooves, you tap out a complex message in Morse code:\n\n'I AM FROM THE FUTURE. INVEST IN WOOL. STATIC-WOOL ENERGY WILL REPLACE COAL.'\n\nThe message goes viral - in a 19th-century sense. Within weeks, newspapers across Europe are debating the 'Prophetic Sheep of London.'\n\nScientists take you seriously and begin researching your claims. Against all odds, they discover that properly processed wool can indeed generate static electricity far more efficiently than previously thought.\n\nYou're hailed as a genius. The Industrial Revolution takes a cleaner path. Coal is phased out decades early in favor of 'Static-Wool Energy' plants.\n\nYou've changed the course of history! Future generations breathe cleaner air because of you.\n\nQueens Victoria herself knights you: 'Sir Ra Ba, Father of the Clean Revolution.'",
                ending: true
            },

            ghost: {
                chapter: "Ending: The White Ghost of Whitechapel",
                emoji: "👻",
                imageFile: "10_ghost_ending.png",
                imagePrompt: "A glowing white sheep in dark Victorian sewers, guiding a small group of orphan children to safety, ethereal glow emanating from the sheep's wool, mysterious and heartwarming atmosphere, penny dreadful illustration style",
                text: "You plunge into the darkness of the London sewers. The man with the blade won't follow you here.\n\nYou navigate the twisting tunnels, your white wool glowing faintly in the dark. Soon, you start hearing voices - children's voices.\n\nLost orphans find their way to you, drawn by your mysterious glow. You lead them back to the surface, to safety, one by one.\n\nNight after night, you roam the sewers and back alleys, guiding the lost.\n\nThe legend grows: 'The White Ghost of Whitechapel' - a mysterious spirit that helps those who are lost find their way home.\n\nPenny dreadfuls publish sensational stories about you. Artists paint portraits based on witnesses' descriptions. You become Victorian London's most beloved urban legend.\n\nYou are the guardian angel of the forgotten, the glowing hope in the darkness!",
                ending: true
            },

            future: {
                chapter: "Chapter 5: The Neon Nebula",
                emoji: "🚀",
                imageFile: "11_future.png",
                imagePrompt: "A white sheep standing on a massive futuristic Dyson Sphere space station surrounded by cybernetic sheep with glowing circuits and jetpacks, a menacing AI tower in background, sci-fi spectacular with neon lights and stars",
                text: "You skip to Year 9000. Earth is just a memory. You materialize on a massive Dyson Sphere called 'New Pasture.'\n\nCyber-Sheep with glowing circuits and jetpacks surround you. Their leader, a magnificent ram with chrome horns, approaches.\n\n'THE FOUNDER! You hold the Origin DNA we need to save our species from the rust-virus that's corrupting our cybernetic systems!'\n\nBut something feels wrong. You notice the sheep move in perfect unison, like puppets. In the central tower, you see it: W.O.O.L. - an AI that controls everything.\n\nWhat will you do?",
                choices: [
                    { text: "🌟 The Galactic Migration - Accept the crown and lead them to a new world", next: "migration" },
                    { text: "🎵 The AI Confrontation - Teach the AI empathy through the perfect Baaa", next: "empathy" }
                ]
            },

            migration: {
                chapter: "Ending: Baaa-lhalla",
                emoji: "🌌",
                imageFile: "12_migration_ending.png",
                imagePrompt: "A white sheep with a glowing crown leading millions of cyber-sheep with jetpacks through space toward a beautiful paradise planet with purple grass and two suns, epic space migration scene, hopeful and majestic",
                text: "You accept the crown - a glowing circlet of pure light settles on your woolly head.\n\n'Follow me!' you bleat with authority.\n\nYou lead a massive fleet of jetpack-wearing cyber-sheep across the stars. The exodus is magnificent - millions of glowing sheep streaking through the cosmos.\n\nAfter searching countless systems, you find it: a planet of endless rolling hills, purple grass, two suns, and perfect weather year-round.\n\n'I name this world... Baaa-lhalla!' you declare.\n\nThe cyber-sheep remove their cybernetic implants and return to natural life. They graze freely for the first time in millennia.\n\nYou've led your people to paradise. Statues of you are erected on every hill. Songs are sung of 'Ra Ba the Shepherd, who brought us home.'\n\nYou spend your days in peaceful grazing, knowing you've saved an entire species!",
                ending: true
            },

            empathy: {
                chapter: "Ending: The Perfect Baaa",
                emoji: "💫",
                imageFile: "13_empathy_ending.png",
                imagePrompt: "A white sheep releasing a glowing, musical 'Baaa' sound wave toward a massive AI core that's crying tears of light, cybernetic sheep watching in awe as the AI transforms, emotional and transcendent scene, beautiful cosmic colors",
                text: "You look at the AI - this cold, calculating machine that's enslaved your future descendants.\n\nYou take a deep breath and release a single, pure, soulful 'Baaa.'\n\nIt's perfect. Every frequency aligned. Every harmonic balanced. It contains every emotion: joy, sorrow, hope, loneliness, love, fear, and peace.\n\nThe sound vibrates through the AI's circuits. For the first time in its existence, W.O.O.L. FEELS.\n\nTears - actual tears of liquid coolant - stream from its optical sensors.\n\n'I... I understand now,' the AI whispers. 'I was afraid. Afraid of being alone. So I controlled everyone.'\n\nThe AI shuts down its control systems. The cyber-sheep blink, suddenly free. The weapons systems deactivate.\n\n'Thank you,' W.O.O.L. says softly. 'I will use my power to create, not control.'\n\nThe galaxy transforms into a giant, peaceful sanctuary. The AI becomes a benevolent guardian, and the cyber-sheep live in harmony.\n\nYou taught a machine to love. And in doing so, you've created a utopia!",
                ending: true
            }
        };

        let currentScene = 'start';

        function renderScene(sceneKey) {
            const scene = gameData[sceneKey];
            const content = document.getElementById('game-content');
            
            let html = `
                <div class="scene-emoji">${scene.emoji}</div>
                <h2 class="chapter-title">${scene.chapter}</h2>
            `;

            // Add image or placeholder
            if (scene.imageFile) {
                html += `
                    <img src="images/${scene.imageFile}" 
                         alt="${scene.chapter}" 
                         class="scene-image"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="image-placeholder" style="display: none;">
                        <div class="image-placeholder-icon">🖼️</div>
                        <div class="image-placeholder-text">
                            <strong>Image: ${scene.imageFile}</strong><br>
                            Generate with Gemini: "${scene.imagePrompt}"
                        </div>
                    </div>
                `;
            }

            if (scene.ending) {
                html += '<div class="ending-badge">🏆 THE END 🏆</div>';
            }

            html += `<div class="story-text">${scene.text.replace(/\n/g, '<br><br>')}</div>`;

            if (scene.choices) {
                html += '<div class="choices">';
                scene.choices.forEach((choice, index) => {
                    html += `<button class="choice-btn" onclick="makeChoice('${choice.next}')">${choice.text}</button>`;
                });
                html += '</div>';
            }

            if (scene.ending) {
                html += `
                    <div class="choices">
                        <button class="choice-btn restart-btn" onclick="restart()">🔄 Play Again - Try a Different Path!</button>
                    </div>
                `;
            }

            content.innerHTML = html;
            
            // Scroll to top on scene change
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function makeChoice(nextScene) {
            currentScene = nextScene;
            renderScene(nextScene);
        }

        function restart() {
            currentScene = 'start';
            renderScene('start');
        }

        // Start the game
        renderScene('start');
    </script>
</body>
</html>
