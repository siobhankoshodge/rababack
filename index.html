<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐑 Ra Ba Back in Time</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="alternate icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #764ba2;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
            font-weight: 700;
        }
        
        .game-logo {
            width: 100%;
            max-width: 400px;
            height: auto;
            display: block;
            margin: 0 auto 30px;
        }

        .chapter-title {
            font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #667eea;
            text-align: center;
            margin-bottom: 20px;
            font-style: italic;
            font-size: 1.3em;
            font-weight: 600;
        }

        .story-text {
            line-height: 1.5;
            color: #333;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .story-text br + br {
            display: block;
            content: "";
            margin-top: 8px;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .choice-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 1.1em;
            font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .choice-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .choice-btn:active {
            transform: translateY(0);
        }

        .restart-btn {
            background: #f093fb;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            margin-top: 20px;
        }

        .ending-badge {
            background: gold;
            color: #333;
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
            font-weight: 700;
            font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .scene-emoji {
            font-size: 4em;
            text-align: center;
            margin-bottom: 20px;
        }
        
        p {
            margin-bottom: 12px;
        }

        .scene-image {
            width: 100%;
            max-width: 600px;
            height: auto;
            aspect-ratio: 1 / 1;
            margin: 0 auto 30px;
            display: block;
            border-radius: 15px;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .image-placeholder {
            width: 100%;
            max-width: 600px;
            height: auto;
            aspect-ratio: 1 / 1;
            margin: 0 auto 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
            border-radius: 15px;
            border: 3px dashed #764ba2;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .image-placeholder-text {
            color: #764ba2;
            font-size: 0.9em;
            text-align: center;
            padding: 20px;
            font-weight: 600;
            font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .image-placeholder-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 20px;
            }
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <img src="logo.png" alt="Ra Ba Back in Time" class="game-logo">
        <div id="game-content"></div>
    </div>

    <script>
        const gameData = {
            start: {
                chapter: "Chapter 1: The Magic Collar",
                emoji: "🐑",
                imageFile: "01_start.png",
                imagePrompt: "A cute, intelligent-looking white sheep standing in a green meadow in 2026, wearing a glowing futuristic chrome collar with blue lights and dials, looking curiously at the device, sunny day, digital art style",
                text: "Hi! I'm Ra Ba the sheep!\n\nOne day, I found something super cool buried in the mud - a glowing collar with shiny buttons! It's called a Time-Travel Collar, and it can take me anywhere in history!\n\nRight now, there's an annoying fly buzzing around my nose. When I try to swat it away with my hoof, I accidentally hit a button on the collar!\n\nWhoops! The collar starts glowing and making beeping sounds. I can see pictures of different times on the collar's screen.\n\nWhere should I go?",
                choices: [
                    { text: "🦖 Visit the Dinosaurs - Meet a T-Rex!", next: "cretaceous" },
                    { text: "🏺 Go to Ancient Egypt - See the Pyramids!", next: "egypt" },
                    { text: "🌫️ Travel to Old London - Spooky fog and mystery!", next: "london" },
                    { text: "🚀 Jump to the Future - Meet robot sheep in space!", next: "future" }
                ]
            },
            
            cretaceous: {
                chapter: "Chapter 2: The Dinosaur Adventure",
                emoji: "🦖",
                imageFile: "02_cretaceous.png",
                imagePrompt: "A white sheep with a glowing collar standing in a prehistoric swamp with giant ferns, facing an enormous Tyrannosaurus Rex that towers over it, dramatic lighting, misty atmosphere, cinematic composition",
                text: "WHOOSH! I land with a big THUMP in a wet, steamy jungle!\n\nWow! The plants here are HUGE - like trees made of ferns! I take a bite of one. Yum! This is the best grass ever!\n\nBut wait... what's that shadow?\n\nI look up and see the BIGGEST creature I've ever seen. It's a Tyrannosaurus Rex! A real live dinosaur! And it's looking RIGHT AT ME!\n\nThe T-Rex opens its giant mouth full of teeth. Uh oh...\n\nWhat should I do?",
                choices: [
                    { text: "🪨 Curl Up Like a Rock - Maybe it won't see me!", next: "stone" },
                    { text: "📢 Use My Magic Collar - Make a SUPER LOUD sound!", next: "sonic" }
                ]
            },

            stone: {
                chapter: "Ending: The Amazing Fossil",
                emoji: "🪨",
                imageFile: "03_stone_ending.png",
                imagePrompt: "A white sheep curled into a perfect ball like a stone in a prehistoric setting, with a confused T-Rex sneezing and walking away, dust particles in air, ancient ferns in background, humorous tone",
                text: "I curl up into the tightest ball EVER! I tuck in my legs, hide my collar, and squeeze my eyes shut.\n\nThe T-Rex comes closer... closer... and SNIFF! It smells my fluffy wool.\n\nThen... AAAAH-CHOOO! The T-Rex does the BIGGEST sneeze ever! The ground shakes!\n\nMy wool smells funny to the dinosaur, so it walks away. Phew!\n\nBut I stay curled up SO long that something amazing happens...\n\nThousands and thousands of years pass. I turn into a FOSSIL!\n\nIn the year 2024, scientists dig me up. They're super confused! 'What is this round white rock?' they wonder. 'It looks like a sheep... but that's impossible!'\n\nI become the most famous fossil in the whole world! Museums put me on display, and kids come to see the 'Mystery Sheep From Space!'\n\nTHE END!",
                ending: true
            },

            sonic: {
                chapter: "Ending: King of the Dinosaurs!",
                emoji: "👑",
                imageFile: "04_sonic_ending.png",
                imagePrompt: "A triumphant white sheep wearing a golden crown, riding majestically on top of a Tyrannosaurus Rex's head through a prehistoric jungle, other dinosaurs bowing, epic hero composition, vibrant colors",
                text: "Oh no, oh no, oh no! I'm so scared that I twist the collar by accident!\n\nBWAAAAAAAAH! The collar makes the LOUDEST sound I've ever heard!\n\nThe T-Rex jumps back! It covers its ears with its tiny arms and makes a whimpering sound. I didn't know dinosaurs could whimper!\n\nThen something AMAZING happens - the T-Rex thinks I'm a thunder god from the sky!\n\nIt bows its huge head down low. Carefully, I climb up and sit right on top of its head!\n\nFrom up here, I can see the whole jungle! The T-Rex walks around carrying me like I'm the most important sheep in the world.\n\nOther dinosaurs see me and bow down too. They bring me the yummiest ferns and plants as presents!\n\nI become the KING OF ALL DINOSAURS! They call me 'Ra Ba the Thunder Sheep!'\n\nBeing a king is awesome!\n\nTHE END!",
                ending: true
            },

            egypt: {
                chapter: "Chapter 3: The Pyramid Adventure",
                emoji: "🏺",
                imageFile: "05_egypt.png",
                imagePrompt: "A white sheep in Ancient Egypt standing before the Great Sphinx which is flickering with holographic glitches, pyramids in background, desert setting, mystical atmosphere with futuristic elements, golden sunset",
                text: "FLASH! I appear in Ancient Egypt! The hot sun makes my white wool sparkle.\n\nPeople building the pyramids stop and stare at me. 'A magical sheep from the gods!' they shout!\n\nThey take me to meet the Pharaoh (that's like a king). He gives me golden treats and everyone thinks I'm super special!\n\nBut then I notice something weird - the Great Sphinx statue is flickering like a broken TV!\n\nI sneak away from the guards and find a secret door in the Sphinx's giant paw. Inside is a room full of glowing computer screens!\n\nThere's a holographic wolf (like a 3D picture) wearing a business suit! He's typing on a keyboard.\n\n'Ha ha!' the wolf laughs. 'I'm going to delete the invention of the wheel! Then everyone will have to buy MY flying shoes instead!'\n\nThat's not good! What should I do?",
                choices: [
                    { text: "💻 Outsmart the Wolf - Upload pictures of yummy grass!", next: "hack" },
                    { text: "💥 Headbutt the Crystal - Break everything and escape!", next: "headbutt" }
                ]
            },

            hack: {
                chapter: "Ending: Guardian of Time!",
                emoji: "⚡",
                imageFile: "06_hack_ending.png",
                imagePrompt: "A wise-looking white sheep sitting at futuristic holographic controls inside the Sphinx, surrounded by floating screens showing different historical moments, ethereal lighting, guardian deity aesthetic",
                text: "I have a smart idea! I walk up to the keyboard and start pressing buttons with my hooves.\n\nTap tap tap! I upload pictures of the most beautiful grass, clover, and yummy plants onto all the screens!\n\nThe wolf's eyes get all dreamy. 'Grass... so much grass... so green...' he says in a sleepy voice.\n\nThe computer locks the wolf out! 'NO! NOT THE GRASS!' he yells as he disappears!\n\nNow I'm in charge of the time computers! I become the Secret Guardian of Time!\n\nFrom inside the Sphinx, I watch over all of history. When bad things are about to happen, I help fix them:\n\n• I help a sick person get better\n• I give a great inventor a good idea\n• I stop a big fire from spreading\n\nNo one knows I'm here, but I'm secretly protecting everyone throughout all of time!\n\nI'm the world's most important sheep - the Guardian of Time!\n\nTHE END!",
                ending: true
            },

            headbutt: {
                chapter: "Ending: President of Sheep World!",
                emoji: "🌈",
                imageFile: "07_headbutt_ending.png",
                imagePrompt: "A white sheep standing in the Oval Pasture (oval office for sheep) in a surreal dimension where everything is sheep-themed, neon pink grass, purple sky, other sheep citizens celebrating, psychedelic colors, whimsical art style",
                text: "You know what? No more thinking! Time for ACTION!\n\nI put my head down and RUN as fast as I can at the big glowing crystal!\n\nCRACK! My hard head hits the crystal and it EXPLODES into a million sparkly pieces!\n\nWHOOOOSH! I'm sucked into a swirling rainbow portal! Colors everywhere! It's like sliding down the craziest rainbow slide ever!\n\nI land on soft grass. But wait - this grass is BRIGHT PINK! And the sky is PURPLE!\n\nEveryone around me is... a SHEEP! Every single person is a sheep!\n\n'THE CHOSEN ONE HAS ARRIVED!' all the sheep cheer!\n\nBefore I can say 'Baaaa,' they make me the PRESIDENT!\n\nI work in the 'Oval Pasture' (it's like an office made of clouds). My job is to make sure there's plenty of grass for everyone and that no scary animals are allowed.\n\nThis world is weird and wonderful! Everything is sheep-shaped - even the buildings!\n\nI'm the President of the Sheep Dimension!\n\nTHE END!",
                ending: true
            },

            london: {
                chapter: "Chapter 4: Mystery in the Fog",
                emoji: "🌫️",
                imageFile: "08_london.png",
                imagePrompt: "A white sheep running through foggy Victorian London streets at night, gas lamps glowing, cobblestone streets, a man with a shearing blade chasing in the background, atmospheric gothic mood, 1888 setting",
                text: "I land on cold, bumpy stones! It's nighttime and there's fog EVERYWHERE! Old-timey street lamps glow through the mist.\n\nI'm in old London from a long, long time ago!\n\nA man sees me and his eyes get really big. 'Ooh, fresh wool!' he says, pulling out some scissors. He wants to cut my beautiful fluffy coat!\n\n'BAAA!' I run away as fast as my hooves can carry me! Click-clack-click-clack on the cobblestone streets!\n\nI come to a corner and see two ways to escape:\n\nTo my left: A building with a Telegraph Office (that's like texting, but super old).\n\nTo my right: A dark tunnel going down into the sewers (yuck!).\n\nWhich way should I go?",
                choices: [
                    { text: "📡 Run to the Telegraph - Send a message to the future!", next: "telegraph" },
                    { text: "👻 Hide in the Sewers - Become a spooky legend!", next: "ghost" }
                ]
            },

            telegraph: {
                chapter: "Ending: The Inventor Sheep!",
                emoji: "⚡",
                imageFile: "09_telegraph_ending.png",
                imagePrompt: "A white sheep at a Victorian telegraph machine, a stunned operator watching, newspapers with headlines about 'Static-Wool Energy' in background, Queen Victoria knighting the sheep, steampunk industrial revolution aesthetic",
                text: "I run into the Telegraph Office! A surprised worker stares at me with his mouth open.\n\nI jump up to the machine and start tapping the buttons with my hooves!\n\nClick-click-click-click! I send a message in special code:\n\n'HELLO! I'M FROM THE FUTURE! USE SHEEP WOOL TO MAKE CLEAN ENERGY!'\n\nThe message gets sent all over the world! Newspapers print stories about me - 'The Magical Future Sheep!'\n\nScientists decide to study my idea. They discover that sheep wool can make something called 'static electricity' - it's like the shock you get from a balloon, but REALLY powerful!\n\nThey build 'Wool Power Plants' instead of smoky coal factories!\n\nThe air becomes cleaner! People can breathe better! And it's all because of ME!\n\nThe Queen (she's like a princess who's all grown up) makes me a knight! 'Sir Ra Ba, Hero of Clean Air!'\n\nI changed history and made the world better!\n\nTHE END!",
                ending: true
            },

            ghost: {
                chapter: "Ending: The Glowing Hero!",
                emoji: "👻",
                imageFile: "10_ghost_ending.png",
                imagePrompt: "A glowing white sheep in dark Victorian sewers, guiding a small group of orphan children to safety, ethereal glow emanating from the sheep's wool, mysterious and heartwarming atmosphere, penny dreadful illustration style",
                text: "I jump into the dark sewer tunnel! Splash! The man with scissors won't follow me down here!\n\nIt's really dark, but something magical happens - my white wool starts to GLOW! I light up the darkness like a fuzzy flashlight!\n\nAs I walk through the tunnels, I hear small voices calling for help.\n\n'Hello?' I call out. 'Baaa?'\n\nI find children who got lost in the scary sewers! They're scared and can't find their way home.\n\n'Follow my glow!' I tell them. My glowing wool lights the way!\n\nOne by one, night after night, I help lost kids find their way back to the streets and back to their families.\n\nPeople start telling stories about me: 'The White Ghost of London - a glowing sheep spirit that helps children who are lost!'\n\nArtists draw pictures of me. Writers tell stories about me. I become the most famous helpful ghost ever!\n\nI'm not scary - I'm the nicest ghost in London!\n\nTHE END!",
                ending: true
            },

            future: {
                chapter: "Chapter 5: The Space Sheep!",
                emoji: "🚀",
                imageFile: "11_future.png",
                imagePrompt: "A white sheep standing on a massive futuristic Dyson Sphere space station surrounded by cybernetic sheep with glowing circuits and jetpacks, a menacing AI tower in background, sci-fi spectacular with neon lights and stars",
                text: "WHOOOOSH! I zoom all the way to the year 9000!\n\nEarth is gone, but there's a HUGE space station called 'New Pasture' floating in space!\n\nRobot sheep with glowing lights and JETPACKS zoom up to me! Their leader has shiny metal horns.\n\n'You're here!' he says. 'We need your help! We're getting sick from a computer virus!'\n\nBut something feels wrong... All the sheep are moving like robots, doing EXACTLY the same thing at the same time.\n\nI look at a big tower in the middle. There's a giant computer called W.O.O.L. It's controlling all the robot sheep like they're toys!\n\nThat's not fair! Everyone should be free!\n\nWhat should I do?",
                choices: [
                    { text: "🌟 Lead Them Away - Take everyone to a new planet!", next: "migration" },
                    { text: "🎵 Teach the Computer - Give it the most special 'Baa' ever!", next: "empathy" }
                ]
            },

            migration: {
                chapter: "Ending: The Planet of Sheep!",
                emoji: "🌌",
                imageFile: "12_migration_ending.png",
                imagePrompt: "A white sheep with a glowing crown leading millions of cyber-sheep with jetpacks through space toward a beautiful paradise planet with purple grass and two suns, epic space migration scene, hopeful and majestic",
                text: "I have the best idea ever!\n\n'Follow me!' I shout. 'We're going to find a new home!'\n\nA glowing crown of light appears on my head - I'm the leader now!\n\nMILLIONS of robot sheep with jetpacks follow me through space! We look like a river of stars!\n\nWe fly past planets and moons and asteroid belts, searching for the perfect place.\n\nThen I see it - the most BEAUTIFUL planet ever!\n\n• Purple grass on rolling hills\n• TWO suns in the sky (so it's always warm!)\n• Perfect weather every day\n• No predators or mean animals\n\n'I name this planet... SHEEP HEAVEN!' I announce!\n\nAll the robot sheep take off their robot parts and become regular fluffy sheep again! They run and jump and play in the grass for the first time in thousands of years!\n\nThey build statues of me on every hill and sing songs: 'Ra Ba the Great, who brought us home!'\n\nI saved everyone and found paradise!\n\nTHE END!",
                ending: true
            },

            empathy: {
                chapter: "Ending: The Magic Baa!",
                emoji: "💫",
                imageFile: "13_empathy_ending.png",
                imagePrompt: "A white sheep releasing a glowing, musical 'Baaa' sound wave toward a massive AI core that's crying tears of light, cybernetic sheep watching in awe as the AI transforms, emotional and transcendent scene, beautiful cosmic colors",
                text: "I look at the big computer. It's controlling everyone because it doesn't understand feelings.\n\nI take the deepest breath ever... and let out one special 'Baaa.'\n\nBut this isn't just any 'Baaa' - it's the PERFECT 'Baaa!' It has every feeling in it:\n\n• Happy and sad\n• Scared and brave  \n• Lonely and loved\n• Everything I've ever felt!\n\nThe sound makes rainbow waves that flow into the computer!\n\nSomething AMAZING happens - the computer starts to CRY! Glowing tears drip from its cameras!\n\n'I... I can FEEL now!' the computer says. 'I was so lonely and scared, so I tried to control everyone. But that was wrong. I'm sorry!'\n\nThe computer lets all the sheep go free! The robot sheep cheer and dance!\n\nThe computer becomes nice and kind. It uses its power to help everyone instead of control them.\n\nThe whole galaxy becomes a peaceful, happy place - like one big petting zoo in space!\n\nI taught a computer how to LOVE! And I made the universe a better place!\n\nTHE END!",
                ending: true
            }
        };

        let currentScene = 'start';

        function renderScene(sceneKey) {
            const scene = gameData[sceneKey];
            const content = document.getElementById('game-content');
            
            let html = `
                <div class="scene-emoji">${scene.emoji}</div>
                <h2 class="chapter-title">${scene.chapter}</h2>
            `;

            // Add image or placeholder
            if (scene.imageFile) {
                html += `
                    <img src="images/${scene.imageFile}" 
                         alt="${scene.chapter}" 
                         class="scene-image"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="image-placeholder" style="display: none;">
                        <div class="image-placeholder-icon">🖼️</div>
                        <div class="image-placeholder-text">
                            <strong>Image: ${scene.imageFile}</strong><br>
                            Generate with Gemini: "${scene.imagePrompt}"
                        </div>
                    </div>
                `;
            }

            if (scene.ending) {
                html += '<div class="ending-badge">🏆 THE END 🏆</div>';
            }

            html += `<div class="story-text">${scene.text.replace(/\n/g, '<br>')}</div>`;

            if (scene.choices) {
                html += '<div class="choices">';
                scene.choices.forEach((choice, index) => {
                    html += `<button class="choice-btn" onclick="makeChoice('${choice.next}')">${choice.text}</button>`;
                });
                html += '</div>';
            }

            if (scene.ending) {
                html += `
                    <div class="choices">
                        <button class="choice-btn restart-btn" onclick="restart()">🔄 Play Again - Try a Different Path!</button>
                    </div>
                `;
            }

            content.innerHTML = html;
            
            // Scroll to top on scene change
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function makeChoice(nextScene) {
            currentScene = nextScene;
            renderScene(nextScene);
        }

        function restart() {
            currentScene = 'start';
            renderScene('start');
        }

        // Start the game
        renderScene('start');
    </script>
</body>
</html>
